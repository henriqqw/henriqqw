  <text x="60" y="170" class="sub">fullstack engineer · security enthusiast · ai developer</text>
  <rect x="60" y="184" width="740" height="2" rx="1" fill="url(#g)"/>

  <text x="60" y="218" class="k">user:</text>      <text x="182" y="218" class="v">Henrique Lanzoni</text>
  <text x="60" y="243" class="k">role:</text>      <text x="182" y="243" class="v">FullStack Software Engineer · Security Enthusiast</text>
  <text x="60" y="268" class="k">languages:</text> <text x="182" y="268" class="v">pt_BR · en_US</text>
  <text x="60" y="293" class="k">focus:</text>     <text x="182" y="293" class="v">Machine Learning · WebScraping · Offensive Security</text>
  <text x="60" y="318" class="k">stack:</text>     <text x="182" y="318" class="v">Python · Go · JavaScript · TypeScript · HTML5 · CSS3</text>
