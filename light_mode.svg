<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470">
  <style>
    text { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }
    .title { fill: #57606a; font-size: 12px; }
    .prompt { fill: #0969da; font-size: 14px; }
    .name { fill: #1f2328; font-size: 34px; font-weight: 700; }
    .sub { fill: #57606a; font-size: 15px; }
    .k { fill: #8250df; font-size: 13px; }
    .v { fill: #24292f; font-size: 13px; }
    .cursor { fill: #0969da; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
  </defs>

  <rect width="860" height="470" rx="16" fill="#f6f8fa"/>
  <rect x="28.5" y="28.5" width="803" height="413" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M41 29h778a12 12 0 0 1 12 12v27H29V41a12 12 0 0 1 12-12z" fill="#eaeef2"/>
  <line x1="29" y1="68.5" x2="831" y2="68.5" stroke="#d0d7de"/>
  <circle cx="54" cy="49" r="6" fill="#ff5f56"/>
  <circle cx="74" cy="49" r="6" fill="#ffbd2e"/>
  <circle cx="94" cy="49" r="6" fill="#27c93f"/>
